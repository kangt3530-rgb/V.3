<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f0f2f5"/>
  <!-- Quiz card continuation -->
  <rect x="40" y="20" width="820" height="380" rx="6" fill="white" stroke="#e2e4e8" stroke-width="1"/>

  <!-- Q2 options -->
  <text x="70" y="58" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">What is the best response?</text>

  <circle cx="85" cy="92" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="97" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Correct. Openly licensed materials do not need quality review.</text>

  <circle cx="85" cy="126" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="131" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Correct. Only commercial textbooks need quality review.</text>

  <circle cx="85" cy="160" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="165" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Not necessarily. OER should only be judged by the reputation of</text>
  <text x="102" y="183" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">the organization that created it.</text>

  <circle cx="85" cy="210" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="215" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Not necessarily. Open licensing supports access and adaptation,</text>
  <text x="102" y="233" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">but the resource still needs structured review for quality.</text>

  <!-- Nav arrows -->
  <rect x="40" y="430" width="380" height="70" rx="6" fill="white" stroke="#e2e4e8" stroke-width="1"/>
  <text x="120" y="458" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7280">Previous</text>
  <text x="80" y="480" font-family="-apple-system, sans-serif" font-size="14" fill="#2563eb">← The Quality Challenge in OER</text>

  <rect x="480" y="430" width="380" height="70" rx="6" fill="white" stroke="#e2e4e8" stroke-width="1"/>
  <text x="700" y="458" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Next</text>
  <text x="700" y="480" font-family="-apple-system, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle">The Purpose of Open 4 Peer Review →</text>
</svg>

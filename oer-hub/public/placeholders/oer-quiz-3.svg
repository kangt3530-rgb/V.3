<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#f0f2f5"/>
  <!-- Page intro text -->
  <rect x="40" y="20" width="500" height="14" rx="3" fill="#9aa0a8" opacity="0.6"/>
  <rect x="40" y="42" width="650" height="14" rx="3" fill="#9aa0a8" opacity="0.5"/>
  <rect x="40" y="64" width="580" height="14" rx="3" fill="#9aa0a8" opacity="0.6"/>

  <!-- "DID I GET THIS?" header box -->
  <rect x="40" y="98" width="820" height="52" rx="4" fill="#d8dce2"/>
  <text x="68" y="130" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1f2937">? DID I GET THIS?</text>

  <!-- Quiz card -->
  <rect x="40" y="160" width="820" height="340" rx="6" fill="white" stroke="#e2e4e8" stroke-width="1"/>

  <!-- Q1 full -->
  <text x="70" y="200" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">Which statement best explains why OER matters?</text>
  <circle cx="85" cy="232" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="237" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">OER are always high quality because they are free.</text>
  <circle cx="85" cy="264" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="269" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">OER can increase access, reduce costs, and allow materials to be adapted.</text>
  <circle cx="85" cy="296" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="301" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">OER should not be reviewed because they are openly licensed.</text>
  <circle cx="85" cy="328" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="333" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">OER are only useful when they come from a well-known organization.</text>

  <line x1="70" y1="360" x2="830" y2="360" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Q2 prompt -->
  <text x="70" y="392" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">An instructor says, "This resource is openly licensed, so we do not need</text>
  <text x="70" y="413" font-family="-apple-system, sans-serif" font-size="15" fill="#111827">to review its quality." What is the best response?</text>
  <circle cx="85" cy="446" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="451" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Correct. Openly licensed materials do not need quality review.</text>
  <circle cx="85" cy="480" r="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="485" font-family="-apple-system, sans-serif" font-size="14" fill="#374151">Correct. Only commercial textbooks need quality review.</text>
</svg>
